<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <pattern id="stripes" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="3" height="8" fill="#22d3ee"/>
    </pattern>
    <pattern id="stripes2" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="3" height="8" fill="#0d9488"/>
    </pattern>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.5" fill="#334155"/>
    </pattern>
    <pattern id="dotsY" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.5" fill="#eab308"/>
    </pattern>
    <pattern id="grid" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#6366f1"/>
    </pattern>
    <clipPath id="c1"><circle cx="760" cy="90" r="45"/></clipPath>
    
    <style>
      .h { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; font-weight: 600; fill: #0ea5e9; }
      .p { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; font-weight: 600; fill: #f1f5f9; }
      .s { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #94a3b8; }
      .pulse { animation: pulse 4s ease-in-out infinite; }
      .pulse2 { animation: pulse 4s ease-in-out 2s infinite; }
      @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .45 } }
    </style>
  </defs>

  <rect width="1200" height="420" fill="#0b0f19"/>

  <!-- headline -->
  <text class="h" x="50" y="130" font-size="88">Build.</text>
  <text class="h" x="50" y="225" font-size="88">Insure.</text>
  <text class="h" x="50" y="320" font-size="88">Ship.</text>
  <text class="p" x="52" y="370" font-size="22">Adam Syafi — IT student &amp; full-stack dev, Malaysia</text>
  <text class="s" x="52" y="398" font-size="16">Building DriveCover · NestJS · Prisma · Supabase · AI</text>

  <!-- geometric grid: 4 cols x 4 rows, cell 90, gap 25, origin x=715 y=45 -->
  <!-- row 1 -->
  <g clip-path="url(#c1)"><rect x="715" y="45" width="90" height="90" fill="url(#stripes)"/></g>
  <rect x="830" y="45" width="90" height="90" fill="url(#dots)"/>
  <rect x="945" y="45" width="90" height="90" fill="url(#grid)" opacity=".85"/>
  <circle cx="1105" cy="90" r="44" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  <!-- row 2 -->
  <rect x="716" y="161" width="88" height="88" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  <circle class="pulse" cx="875" cy="205" r="45" fill="#0284c7"/>
  <g stroke="#14b8a6" stroke-width="2">
    <line x1="950" y1="190" x2="1030" y2="190"/><line x1="955" y1="200" x2="1025" y2="200"/>
    <line x1="950" y1="210" x2="1030" y2="210"/><line x1="955" y1="220" x2="1025" y2="220"/>
    <line x1="950" y1="230" x2="1030" y2="230"/><line x1="945" y1="248" x2="1035" y2="248"/>
  </g>
  <rect x="1060" y="160" width="90" height="90" fill="#4f46e5"/>
  <!-- row 3 -->
  <rect x="715" y="275" width="90" height="90" fill="url(#dotsY)" opacity=".8"/>
  <circle cx="875" cy="320" r="44" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="945" y="275" width="90" height="90" fill="url(#stripes2)"/>
  <!-- small accents to fill row 3 right -->
  <circle class="pulse2" cx="1105" cy="320" r="45" fill="#22d3ee"/>
</svg>
